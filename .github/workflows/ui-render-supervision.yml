name: UI Render Supervision

on:
  pull_request:
    paths:
      - 'src/**'
      - 'ui-render/**'
      - 'scripts/capture-ui-render.mjs'
      - 'scripts/ui-render-catalog.mjs'
      - 'package.json'
      - '.github/workflows/ui-render-supervision.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Install Chromium for deterministic renders
        run: npx playwright install --with-deps chromium
      - name: Capture production-component scenarios
        run: npm run ui:render:capture -- --output artifacts/ui-render
      - name: Upload UI render gallery
        uses: actions/upload-artifact@v4
        with:
          name: ui-render-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: artifacts/ui-render
          if-no-files-found: error
          retention-days: 14
      - name: Write workflow summary
        run: |
          echo '## UI Render Supervision' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '真实生产组件已按确定性状态旅程渲染，并通过场景设计契约。下载本次 workflow 的 `ui-render-*` artifact，打开 `index.html` 逐步审查。' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          node -e "const c=require('./ui-render/scenarios.json'); for (const s of c.scenarios) console.log('- ' + s.title + ' (`' + s.id + '`)')" >> "$GITHUB_STEP_SUMMARY"
      - name: Link renders from the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ggai-ui-render-supervision -->'
            const body = `${marker}\n### UI Render Supervision\n\n真实生产组件截图已生成。请在 [本次 workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 下载 \`ui-render-*\` artifact，并打开其中的 \`index.html\`。\n\n截图由仓库场景夹具和 Chromium 自动生成，不依赖人工点击。`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
