name: Capability Runtime Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Capability Runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency manifests
        run: npm run deps:check

      - name: Check architecture boundaries
        run: npm run architecture:check

      - name: Lint source
        run: npm run lint

      - name: Run startup and architecture-script tests
        run: npm run test:startup

      - name: Run daemon tests
        run: npm run test:daemon

      - name: Run UI regression tests
        run: npm run test:ui

      - name: Build production artifacts
        run: npm run build

      - name: Verify packaged daemon installation
        run: npm run package:daemon:verify
